services:
  server:
    container_name: server
    build:
      context: ../server
      dockerfile: docker/base.Dockerfile
    ports:
      - "8000:8000"
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
  database:
    image: postgres:18-alpine
    container_name: database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=database
      - PG_DATA=/var/opt/blog/db/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/opt/blog/db/pgdata
    healthcheck:
      test: [ "CMD", "pg_isready -U postgres_user -d postgres_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  # client:

volumes:
  pgdata:
    driver: local
